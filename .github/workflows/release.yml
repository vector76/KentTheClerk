# Builds the Go kb for Windows, macOS and Linux (amd64 and arm64) on a version tag vX.Y.Z, and attaches one
# zip per platform, plus SHA256SUMS, to a GitHub release. Each zip holds the executable beside the files the
# agent reads:
#   kent-<version>-<os>-<arch>/kb[.exe], README.md, procedure.md, rules/, front-ends/
# The version is the tag without its leading "v"; it is built into the executable as system_version.
# The Go toolchain is the one go.mod names, the version the parity harness was run with.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # only vX.Y.Z: system_version must parse as numbers (kb check compares it to 0.3.0)
      - name: check the tag
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # the differential tests compare with the exact Python and pypdf the port reproduces; without them
      # they skip and only the golden-file tests run
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13.1"
      - run: python -m pip install pypdf==6.14.2
      - run: go vet ./...
      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [windows, darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="kent-${version}-${GOOS}-${GOARCH}"
          exe=kb; [ "$GOOS" = windows ] && exe=kb.exe
          mkdir -p "dist/$name"
          go build -trimpath -ldflags "-s -w -X kenttheclerk.version=${version}" -o "dist/$name/$exe" ./cmd/kb
          cp README.md procedure.md "dist/$name/"
          cp -r rules front-ends "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          echo "ZIP=dist/$name.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: zip-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.ZIP }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zip-*
          merge-multiple: true
          path: dist
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum *.zip > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "Kent the Clerk ${GITHUB_REF_NAME#v}" --generate-notes
